[versions]
utilities = "3.5.5"
jackson = "3.2.4"
jackson-annotations = "2.22"
paper = "1.21.11-R0.1-SNAPSHOT"
junit = "6.1.3"
huskclaims = "1.5.10"
palantir = "2.102.0"
plotsquared = "7.6.0"

[libraries]
eldoutil-plugin = { module = "de.eldoria.util:plugin", version.ref = "utilities" }
eldoutil-jackson = { module = "de.eldoria.util:jackson-configuration", version.ref = "utilities" }
eldoutil-updater = { module = "de.eldoria.util:updater", version.ref = "utilities" }
eldoutil-metrics = { module = "de.eldoria.util:metrics", version.ref = "utilities" }

jackson-core = { module = "tools.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }

bstats = "org.bstats:bstats-bukkit:3.2.1"
jetbrains-annotations = "org.jetbrains:annotations:26.1.0"
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }

bentobox = "world.bentobox:bentobox:2.7.0"
griefprevention = "com.github.TechFortress:GriefPrevention:18.0.0"
towny = "com.palmergames.bukkit.towny:towny:0.103.2.13"
plotsquared-core = { module = "com.intellectualsites.plotsquared:plotsquared-core", version.ref = "plotsquared" }
plotsquared-bukkit = { module = "com.intellectualsites.plotsquared:plotsquared-bukkit", version.ref = "plotsquared" }
worldguard-bukkit = "com.sk89q.worldguard:worldguard-bukkit:7.0.20"
huskclaims-bukkit = { module = "net.william278.huskclaims:huskclaims-bukkit", version.ref = "huskclaims" }
guice = "com.google.inject:guice:7.0.0"
redprotect-core = "io.github.fabiozumbi12.RedProtect:RedProtect-Core:8.1.2"
redprotect-spigot = "io.github.fabiozumbi12.RedProtect:RedProtect-Spigot:8.1.2"

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
utilities = ["eldoutil-plugin", "eldoutil-jackson", "eldoutil-updater", "eldoutil-metrics"]
jackson = ["jackson-core", "jackson-databind", "jackson-yaml", "jackson-annotations"]

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.10.4" }
publishdata = { id = "de.chojo.publishdata", version = "2.1.0" }
publishdata-manifest = { id = "de.chojo.publishdata.manifest", version = "2.1.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
pluginyml-paper = { id = "de.eldoria.plugin-yml.paper", version = "0.9.0" }
runpaper = { id = "xyz.jpenilla.run-paper", version = "3.1.0" }
hangar = { id = "io.papermc.hangar-publish-plugin", version = "0.1.4" }
minotaur = { id = "com.modrinth.minotaur", version = "2.10.0" }
